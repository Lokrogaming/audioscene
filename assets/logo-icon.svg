<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3140"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#3a6df0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grundform wie OBS-Dock, dunkel abgerundet -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#383e52" stroke-width="4" opacity="0.7"/>

  <!-- Sound-Wellen links -->
  <g fill="none" stroke-linecap="round">
    <path d="M118 212 a72 72 0 0 1 0 88" stroke="#3a6df0" stroke-width="20" opacity="0.35"/>
    <path d="M158 186 a112 112 0 0 1 0 140" stroke="#3a6df0" stroke-width="20" opacity="0.6"/>
  </g>
  <!-- Sound-Wellen rechts -->
  <g fill="none" stroke-linecap="round">
    <path d="M394 212 a72 72 0 0 0 0 88" stroke="#3a6df0" stroke-width="20" opacity="0.35"/>
    <path d="M354 186 a112 112 0 0 0 0 140" stroke="#3a6df0" stroke-width="20" opacity="0.6"/>
  </g>

  <!-- Mikrofon-Kapsel -->
  <g filter="url(#glow)">
    <rect x="216" y="128" width="80" height="152" rx="40" fill="#d7dae2"/>
    <line x1="216" y1="176" x2="296" y2="176" stroke="#1b1e27" stroke-width="6" opacity="0.55"/>
    <line x1="216" y1="202" x2="296" y2="202" stroke="#1b1e27" stroke-width="6" opacity="0.55"/>
    <line x1="216" y1="228" x2="296" y2="228" stroke="#1b1e27" stroke-width="6" opacity="0.55"/>
    <!-- Bügel -->
    <path d="M186 256 v24 a70 70 0 0 0 140 0 v-24" fill="none" stroke="#d7dae2" stroke-width="20" stroke-linecap="round"/>
    <!-- Ständer -->
    <line x1="256" y1="350" x2="256" y2="392" stroke="#d7dae2" stroke-width="18" stroke-linecap="round"/>
    <line x1="212" y1="396" x2="300" y2="396" stroke="#3a6df0" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- VU-Balken unten als "Audio-Mixer" Anspielung -->
  <g>
    <rect x="156" y="428" width="28" height="26" rx="7" fill="#3dd68c"/>
    <rect x="192" y="418" width="28" height="36" rx="7" fill="#3dd68c"/>
    <rect x="228" y="406" width="28" height="48" rx="7" fill="url(#bar)"/>
    <rect x="264" y="406" width="28" height="48" rx="7" fill="url(#bar)"/>
    <rect x="300" y="418" width="28" height="36" rx="7" fill="#ffb224"/>
    <rect x="328" y="428" width="28" height="26" rx="7" fill="#e5484d"/>
  </g>

  <!-- REC-Punkt -->
  <circle cx="402" cy="110" r="30" fill="#e5484d"/>
  <circle cx="402" cy="110" r="30" fill="none" stroke="#fff" stroke-width="8" opacity="0.9"/>
</svg>
